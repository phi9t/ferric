# Configuration for PR labeler
# https://github.com/actions/labeler

# C++ code
'C++':
  - changed-files:
    - any-glob-to-any-file:
      - '**/*.cc'
      - '**/*.hh'
      - '**/*.cpp'
      - '**/*.hpp'

# Rust code
'Rust':
  - changed-files:
    - any-glob-to-any-file:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'

# Python code
'Python':
  - changed-files:
    - any-glob-to-any-file:
      - '**/*.py'
      - '**/requirements*.txt'
      - '**/setup.py'
      - '**/pyproject.toml'

# Bazel build system
'Bazel':
  - changed-files:
    - any-glob-to-any-file:
      - '**/*.bazel'
      - '**/*.bzl'
      - '**/BUILD'
      - '**/BUILD.bazel'
      - '**/WORKSPACE'
      - '**/WORKSPACE.bazel'
      - '**/MODULE.bazel'

# Documentation
'Documentation':
  - changed-files:
    - any-glob-to-any-file:
      - '**/*.md'
      - '**/docs/**/*'
      - '**/*.rst'

# Tests
'Tests':
  - changed-files:
    - any-glob-to-any-file:
      - '**/*_test.cc'
      - '**/*_test.rs'
      - '**/*_test.py'
      - '**/test_*.py'

# CI/CD
'CI/CD':
  - changed-files:
    - any-glob-to-any-file:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '**/ci/**'

# Configuration
'Configuration':
  - changed-files:
    - any-glob-to-any-file:
      - '**/*.toml'
      - '**/*.yaml'
      - '**/*.yml'
      - '**/*.json'
      - '**/.clang-format'
      - '**/rustfmt.toml'
      - '**/clippy.toml'

# Dependencies
'Dependencies':
  - changed-files:
    - any-glob-to-any-file:
      - '**/MODULE.bazel'
      - '**/requirements*.txt'
      - '**/Cargo.toml'

# Foundation libraries
'Foundation':
  - changed-files:
    - any-glob-to-any-file:
      - 'ferric_continuum/foundation/**'

# Agents
'Agents':
  - changed-files:
    - any-glob-to-any-file:
      - 'agents/**'

# Examples
'Examples':
  - changed-files:
    - any-glob-to-any-file:
      - 'examples/**'
      - 'ferric_continuum/hello/**'

